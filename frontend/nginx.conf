server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing: unknown paths are the app's, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The API is proxied so the browser sees a single origin and no CORS
    # preflight is needed for uploads.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Document analysis is slow work; do not cut the connection early.
        proxy_read_timeout 300s;
        client_max_body_size 64M;
    }
}
